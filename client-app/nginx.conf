# Use Docker's embedded DNS resolver so the "api" upstream is re-resolved
# at request time instead of being cached forever at nginx startup.
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxy API calls to the backend container so the frontend and API
    # share the same origin (matches proxy.conf.json used in `ng serve`).
    # NOTE: proxy_pass has no trailing URI here on purpose — when the target
    # is a variable (needed for per-request DNS re-resolution), nginx does not
    # rewrite the matched location prefix, so the incoming "/api/..." path is
    # forwarded to the upstream unchanged, which is exactly what we want here.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
