services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: productmanager-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in your .env file}
      MSSQL_PID: Developer
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ProductManager.WebAPI/Dockerfile
    container_name: productmanager-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProductManagerDb;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=true;Encrypt=true"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file}
      JwtSettings__Issuer: ProductManagerAPI
      JwtSettings__Audience: ProductManagerClient
      JwtSettings__ExpiryMinutes: "60"
      Cors__AllowedOrigins__0: "http://localhost:${CLIENT_PORT:-4200}"
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  client:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: productmanager-client
    depends_on:
      - api
    ports:
      - "${CLIENT_PORT:-4200}:80"
    restart: unless-stopped

volumes:
  sqlserver_data:
